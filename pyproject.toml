[tool.mypy]
ignore_missing_imports = true
exclude = ['^\.venv.*'] # Shut up mypy. youre reading deps rn not code. you are meant to read code

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "ujson.*",
]
ignore_errors = true
ignore_missing_imports = true

[tool.uv]
managed = true
default-groups = []

[project]
name = "moppy"
version = "1.1.0"
description = "Modular Protocol Server"
requires-python = ">=3.10, <3.14"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "rbaxim" }
]

dependencies = [
    # Core Server & Web
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
    "hypercorn==0.18.0",
    "starlette==1.0.0",
    "slowapi==0.1.9",

    # Networking & Async IO
    "aiohttp==3.13.5",
    "aiofiles==25.1.0",
    "aiohappyeyeballs==2.6.1",
    "certifi==2026.4.22",

    # System & Utils
    "psutil==7.2.2",
    "colorama==0.4.6",
    
    # Compression & Encryption
    "cryptography==48.0.0",
    "brotlicffi==1.2.0.1",
    "brotli==1.2.0",
    "brotli-asgi==1.6.0",
    "base91==1.0.1",
    
    # Experimental
    "aioquic==1.3.0"
]

# Development-only tools (keep your production environment clean)
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "types-aiofiles==25.1.0.20260508",
    "types-Deprecated==1.3.1.20260130",
    "bandit[sarif, toml]>=1.9.4",
    "semgrep>=1.163.0"
]
dev-pypy = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "types-aiofiles==25.1.0.20260508",
    "types-Deprecated==1.3.1.20260130",
    "bandit[sarif, toml]>=1.9.4", # PyPy can't build semgrep because of yaml
]
windows = [
    "pythonnet==3.0.5",
]
unix = [
    "uvloop==0.22.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "types-aiofiles==25.1.0.20260508",
    "bandit[sarif, toml]>=1.9.4",
    "semgrep>=1.163.0"
]
dev-pypy = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "types-aiofiles==25.1.0.20260508",
    "types-Deprecated==1.3.1.20260130",
    "bandit[sarif, toml]>=1.9.4", # PyPy can't build semgrep because of yaml
]
windows = [
    "pythonnet==3.0.5",
]
unix = [
    "uvloop==0.22.1",
]

[tool.bandit]
skips = ["B603", "B404", "B607", "B605", "B104", "B110", "B101"] # yes bandit. its called RCE for a reason. yes i know its bad, i literally state that its RCE.
min_severity = "MEDIUM"
min_confidence = "MEDIUM"